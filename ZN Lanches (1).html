<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZN Lanches – Faça seu pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141210;--card:#1f1b17;--ink:#f6f1e7;--mut:#b8ad9a;--y:#ffc21a;--r:#e2352b;--line:#3a332b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#141210;}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header{padding:44px 0 28px;border-bottom:4px solid var(--y)}
h1{font:400 clamp(54px,16vw,104px)/.9 'Bowlby One',Impact,sans-serif;margin:0;transform:rotate(-2deg);color:#fff}
h1 span{color:var(--y)}
.tag{margin:18px 0 22px;color:var(--mut);max-width:30ch}
.btn{display:inline-block;background:var(--y);color:#141210;font-weight:700;font-size:19px;padding:15px 24px;border-radius:999px;text-decoration:none}
.btn:hover,.btn:focus-visible{background:#fff;outline:3px solid var(--r);outline-offset:3px}
h2{font:400 28px 'Bowlby One',Impact,sans-serif;color:var(--y);margin:40px 0 6px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:16px 0;border-bottom:1px dashed var(--line)}
.item b{font-size:20px}
.item .p{font:400 22px 'Bowlby One',Impact,sans-serif;color:var(--y);white-space:nowrap}
.item small{grid-column:1/-1;color:var(--mut);font-size:15px}
.item a{grid-column:1/-1;justify-self:start;color:var(--ink);font-weight:600;font-size:15px;margin-top:4px}
.promo{background:var(--r);border-radius:16px;padding:16px 18px;margin-top:40px}
.promo p{margin:0}
.promo s{opacity:.8}
.ph{width:112px;height:112px;object-fit:cover;border-radius:14px;grid-row:1/4;grid-column:1;align-self:start}
.item.hasimg{grid-template-columns:112px 1fr auto}
.item.hasimg small,.item.hasimg a{grid-column:2/-1}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{width:120px;height:auto;border-radius:50%}
.bev{width:100%;border-radius:16px;margin:10px 0}
footer{margin:48px 0 0;background:var(--y);color:#141210;padding:28px 0 40px}
footer .btn{background:#141210;color:var(--y)}
footer p{margin:0 0 14px;font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 20px #0008}
</style>
</head>
